</style><body><canvas id="world"></canvas><header><small>MIRROR ABYSS　 /　 USTC</small><b>镜渊 · 中科大</b></header><aside><canvas id="mini" width="450" height="194"></canvas><small>三校区全图 · 点击就近落脚</small><em>北 ↑ 上北下南</em></aside><div id="status">正在展开地图</div><footer><select aria-label="前往地标" id="dest"></select><button id="mirror">佩戴硬体</button><button id="light">暮色</button><button id="zoom">拉近</button><button id="help">操作</button><button id="hide">收起界面</button></footer><div class="pad"><i></i><button data-k="w">▲</button><i></i><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><div id="wait">正在展开三校区像素地图…</div><script id="assets" type="application/json">__ASSETS__</script><script>
'use strict';
const S=JSON.parse(document.getElementById('assets').textContent),el=i=>document.getElementById(i),canvas=el('world'),ctx=canvas.getContext('2d'),mini=el('mini'),mc=mini.getContext('2d'),pic={},keys=new Set();
function png(text){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('图片解码失败'));i.src='data:image/png;base64,'+text;});}
let grass,mask,miniBg,player={x:0,y:0},cam={x:0,y:0},last=0,phase=0,walking=false,facing=1,zoom=2,night=false,mirror=false,dest=null,clickMarker=null,ripples=[],t=0,loaded=false;
const SCALE=[1,1.6,2.25,3],storeKey='MAIES-west-pixel-walk-v1';
function setupSize(){const factor=SCALE[zoom];canvas.width=Math.ceil(innerWidth/factor);canvas.height=Math.ceil(innerHeight/factor);ctx.imageSmoothingEnabled=false;}setupSize();onresize=setupSize;
function valid(x,y){x=Math.round(x);y=Math.round(y);return x>=0&&x<S.w&&y>=0&&y<S.h&&mask[(y*S.w+x)*4]>100;}
function safe(x,y,r=140){if(valid(x,y))return{x,y};for(let d=2;d<r;d+=3)for(let a=0;a<6.28;a+=.16){let xx=x+d*Math.cos(a),yy=y+d*Math.sin(a);if(valid(xx,yy))return{x:xx,y:yy};}return null;}
function move(x,y,snap=false){let p=safe(x,y,550);if(!p)return;player=p;dest=null;clickMarker=null;if(snap){cam={...p};}save();}
function save(){try{localStorage.setItem(storeKey,JSON.stringify({x:player.x,y:player.y,night,zoom,mirror}));}catch(e){}}
function note(txt){el('status').textContent=txt;}
function jump(i){let m=S.marks[i];move(m.x,m.y,true);note(m.name+'　·　'+m.about);el('dest').value=i;}
let tinyActor=['.....333....','....33333...','....3ff3c...','....5f5fc...','.....ff.....','....4554....','...474474...','...f7447f...','....4444....','....7777....','....7677....','....3..3....','....3..3....','...22..22...'];const ac={'3':'#453c43','c':'#866451','f':'#f2c499','5':'#705349','4':'#537d81','7':'#95b2a0','6':'#b3c7ae','2':'#3f4c4e'};
function person(x,y){let px=Math.round(x),py=Math.round(y),step=walking?Math.sin(phase)*1.4:0;ctx.fillStyle='#627e6b';ctx.fillRect(px-5,py-1,10,2);
 for(let j=0;j<tinyActor.length;j++)for(let i=0;i<12;i++){let c=ac[tinyActor[j][i]];if(!c)continue;ctx.fillStyle=c;ctx.fillRect(px+(facing<0?5-i:i-6),py-14+j+(j>10?Math.round((i<6?1:-1)*step):0),1,1);}
 ctx.fillStyle='#f3cb7b';ctx.fillRect(px+(facing<0?-2:1),py-13,3,1);ctx.fillRect(px+(facing<0?-2:1),py-12,1,1);}
function clock(now){requestAnimationFrame(clock);if(!loaded)return;let dt=Math.min(.04,(now-last)/1000||0);last=now;t+=dt;
 let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));if(dx||dy)dest=null;
 if(dest){dx=dest.x-player.x;dy=dest.y-player.y;if(Math.hypot(dx,dy)<2){dest=null;dx=dy=0;}}
 let nn=Math.hypot(dx,dy);walking=false;
 if(nn){let speed=(keys.has('shift')?88:49)*dt;dx=dx/nn*speed;dy=dy/nn*speed;let xx=player.x,yy=player.y;
  if(valid(xx+dx,yy))player.x+=dx;if(valid(player.x,yy+dy))player.y+=dy;walking=Math.hypot(player.x-xx,player.y-yy)>.02;if(dx)facing=Math.sign(dx);if(walking){phase+=dt*10;}else if(dest){dest=null;note('前方有水岸或建筑，沿小路绕行。');}}
 if((now|0)%900<40&&walking)save();
 let lerp=1-Math.exp(-dt*11);cam.x+=(player.x-cam.x)*lerp;cam.y+=(player.y-cam.y)*lerp;render();}
function render(){let ww=canvas.width,hh=canvas.height,x=Math.max(0,Math.min(S.w-ww,Math.round(cam.x-ww/2))),y=Math.max(0,Math.min(S.h-hh,Math.round(cam.y-hh/2)));canvas._origin=[x,y];ctx.setTransform(1,0,0,1,-x,-y);ctx.filter=mirror?'hue-rotate(112deg) saturate(1.3) brightness(.66) contrast(1.04)':'none';ctx.drawImage(grass,x,y,ww,hh,x,y,ww,hh);
 for(let r of ripples){if(r[0]<x||r[0]>x+ww||r[1]<y||r[1]>y+hh)continue;let k=Math.sin(t*1.8+r[2]);if(k<.3)continue;ctx.fillStyle=k>.8?'#c4d6b4':'#93b9a8';ctx.fillRect(r[0],r[1],2+Math.floor(k*4),1);}
 let drew=false;for(let o of S.objects){let a=pic[o[0]],xx=o[1],yy=o[2];if(xx>x+ww||xx+a.width<x||yy>y+hh||yy+a.height<y)continue;
 if(!drew&&o[3]>=player.y){person(player.x,player.y);drew=true;}let overlaps=o[3]>player.y&&player.x>=xx&&player.x<xx+a.width&&player.y-6>=yy&&player.y-6<yy+a.height;
 if(overlaps)ctx.globalAlpha=.62;ctx.drawImage(a,xx,yy);ctx.globalAlpha=1;}
 if(!drew)person(player.x,player.y);
 ctx.filter='none';
 if(mirror){let mg=ctx.createLinearGradient(0,y,0,y+hh);mg.addColorStop(0,'#141a3a99');mg.addColorStop(.5,'#1b24506b');mg.addColorStop(1,'#0d13305c');ctx.fillStyle=mg;ctx.fillRect(x,y,ww,hh);for(let i=0;i<110;i++){let sx=x+((i*167.7)%ww),sy=y+((i*91.3)%(hh*.62));ctx.fillStyle=i%9===0?'#ffe6b0':'#cfe6ff';ctx.fillRect(sx|0,sy|0,1,1);}let moX=x+ww*.30,moY=y+hh*.18,moR=Math.max(10,Math.round(hh*.045));ctx.fillStyle='#dbe6f5';ctx.beginPath();ctx.arc(moX,moY,moR,0,6.2832);ctx.fill();ctx.fillStyle='#c3cfe2';ctx.beginPath();ctx.arc(moX-moR*.3,moY-moR*.2,moR*.24,0,6.2832);ctx.arc(moX+moR*.34,moY+moR*.3,moR*.17,0,6.2832);ctx.fill();ctx.fillStyle='#93e8dd';for(let i=0;i<30;i++){let ph=t*.55+i*1.7,px=x+((Math.sin(ph*.7+i)*.5+.5)*ww),py=y+hh*.5+Math.sin(ph*1.1+i*2.3)*hh*.3;ctx.globalAlpha=.25+.3*Math.abs(Math.sin(ph*1.6));ctx.fillRect(px|0,py|0,2,2);}ctx.globalAlpha=1;}
 if(clickMarker&&t-clickMarker.time<1){ctx.strokeStyle='#f4deb1';ctx.strokeRect(clickMarker.x-3,clickMarker.y-3,7,7);}
 if(night){ctx.fillStyle='#48527e4d';ctx.fillRect(x,y,ww,hh);for(let o of S.objects){if(o[0]==='lamp'&&o[1]>x-20&&o[1]<x+ww&&o[2]>y-20&&o[2]<y+hh){ctx.fillStyle='#ffe6a34a';ctx.fillRect(o[1]+10,o[2]+4,10,7);ctx.fillStyle='#f8da8c';ctx.fillRect(o[1]+13,o[2]+5,5,4);}}}
 ctx.setTransform(1,0,0,1,0,0);const MW=mini.width,MH=mini.height;mc.drawImage(miniBg,0,0,MW,MH);let mx=player.x/S.w*MW,my=player.y/S.h*MH;mc.strokeStyle='#fbebbc';mc.strokeRect(x/S.w*MW,y/S.h*MH,ww/S.w*MW,hh/S.h*MH);mc.fillStyle='#703e3b';mc.fillRect(mx-2,my-2,5,5);mc.fillStyle='#ffda84';mc.fillRect(mx-1,my-1,3,3);}
async function init(){[grass,miniBg]=await Promise.all([png(S.ground),png(S.mini)]);mini.width=S.mini_w||450;mini.height=S.mini_h||418;mini.style.height=(150*mini.height/mini.width)+'px';const nv=await png(S.nav),c=document.createElement('canvas');c.width=S.w;c.height=S.h;let cc=c.getContext('2d',{willReadFrequently:true});cc.drawImage(nv,0,0);mask=cc.getImageData(0,0,S.w,S.h).data;
 await Promise.all(Object.entries(S.sprites).map(async([k,v])=>pic[k]=await png(v)));let rd=12345;function rand(){rd=rd*16807%2147483647;return rd/2147483647;}
 const a=S.marks[0];for(let j=0;j<5000;j++){let x=Math.round(a.x-140+rand()*490),y=Math.round(a.y-130+rand()*250);cc.drawImage(grass,x,y,1,1,0,0,1,1);let co=cc.getImageData(0,0,1,1).data;if(co[0]<143&&co[1]>146&&co[1]-co[0]>32&&co[2]>127)ripples.push([x,y,rand()*7]);if(ripples.length>100)break;}
 S.marks.forEach((m,i)=>el('dest').add(new Option(m.name,i)));let old;try{old=JSON.parse(localStorage.getItem(storeKey));}catch(e){}jump(1);
 if(old&&valid(old.x,old.y)){player={x:old.x,y:old.y};cam={...player};zoom=Math.max(0,Math.min(3,Number(old.zoom)||0));night=!!old.night;mirror=!!old.mirror;el('mirror').textContent=mirror?'摘下硬体':'佩戴硬体';el('light').textContent=night?'日光':'暮色';setupSize();}el('light').textContent=night?'日光':'暮色';loaded=true;el('wait').remove();window.westGame={jump,state:()=>({...player,night,zoom}),ready:true};requestAnimationFrame(clock);}
el('dest').onchange=e=>jump(Number(e.target.value));el('mirror').onclick=()=>{mirror=!mirror;el('mirror').textContent=mirror?'摘下硬体':'佩戴硬体';note(mirror?'镜渊硬体已佩戴：感官信号接入，噪声与痛觉被屏蔽。':'硬体已摘下，回到现实的中科大。');save();};
el('light').onclick=()=>{night=!night;el('light').textContent=night?'日光':'暮色';save();};el('zoom').onclick=()=>{zoom=(zoom+1)%4;setupSize();save();el('zoom').textContent='倍率 '+SCALE[zoom]+'×';};
el('help').onclick=()=>note('方向键 / WASD 行走，Shift 快走。点击地面直走，点小地图或下拉菜单可换地点。地图上北下南；M 键或“硬体”按钮在现实与镜渊之间切换。');
el('hide').onclick=()=>{el('hide').textContent=document.body.classList.toggle('bare')?'显示界面':'收起界面';};
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='m'){el('mirror').click();e.preventDefault();return;}
 if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d','shift'].includes(k)){keys.add(k);e.preventDefault();}});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));onblur=()=>{keys.clear();if(loaded)save();};onpagehide=()=>{if(loaded)save();};
for(let b of document.querySelectorAll('[data-k]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.k);};b.onpointerup=b.onpointercancel=()=>keys.delete(b.dataset.k);}
canvas.onpointerdown=e=>{if(!loaded)return;let xx=Math.round(canvas._origin[0]+e.clientX*canvas.width/canvas.clientWidth),yy=Math.round(canvas._origin[1]+e.clientY*canvas.height/canvas.clientHeight);if(valid(xx,yy)){dest={x:xx,y:yy};clickMarker={...dest,time:t};}else note('这里是水面或建筑，点岸边、桥面或道路可行走。');};
mini.onpointerdown=e=>{if(!loaded)return;let r=mini.getBoundingClientRect();move((e.clientX-r.left)/r.width*S.w,(e.clientY-r.top)/r.height*S.h,true);note('已切换到附近可行走的地面。');};
init().catch(e=>el('wait').textContent='打开失败：'+e.message);
