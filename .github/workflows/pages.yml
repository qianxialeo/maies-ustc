# 推送到 main 后自动构建并发布到 GitHub Pages（Settings → Pages → Source: GitHub Actions）
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python source/make.py
          python source/bundle.py
      - name: 组装站点
        run: |
          mkdir -p site
          cp 中科大像素漫游.html site/index.html
          cp 中科大全图.png site/map.png
          cp West-Lakeside.png site/lakeside.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
